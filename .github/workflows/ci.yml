name: CI

on:
  pull_request:

  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check generated files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install perltidy

          case $OSTYPE in
          linux-gnu) platform=linux ;;
          darwin*) platform=darwin ;;
          esac
          case $MACHTYPE in
          x86_64-*) arch=amd64 ;;
          arm64-* | aarch64-*) arch=arm64 ;;
          esac

          file=/usr/local/bin/shfmt
          gh release download -R mvdan/sh --pattern "shfmt_v*_${platform}_${arch}" -O "$file"
          chmod a+x "$file"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check generated files
        run: src/build-all.sh --no-write

  unit-tests:
    name: Unit tests
    needs: check

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run unit tests
        run: tests/run-tests.sh
